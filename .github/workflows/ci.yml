name: CI

on:
  push:
  pull_request:
  # Run daily to catch when Rust updates cause problems to happen.
  schedule:
    - cron: "00 01 * * *"

jobs:
  rust:
    name: Rust

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["stable"]

    runs-on: ${{ matrix.os }}

    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Build (secure)
        run: cargo build --features secure

      - name: Test (secure)
        run: cargo test --features secure

      - name: Test libmimalloc-sys crate bindings (secure)
        run: cargo run --manifest-path libmimalloc-sys/sys-test/Cargo.toml --features secure

      - name: Build (no secure)
        run: cargo build

      - name: Test (no secure)
        run: cargo test

      - name: Test libmimalloc-sys crate bindings (no secure)
        run: cargo run --manifest-path libmimalloc-sys/sys-test/Cargo.toml

      - name: Build (extended, config)
        run: cargo build --features config

      - name: Test (extended, config)
        run: cargo test --features config

      - name: Test libmimalloc-sys crate bindings (extended)
        run: cargo run --manifest-path libmimalloc-sys/sys-test/Cargo.toml --features extended

      - name: Test override dylib
        if: ${{ !contains(matrix.os, 'windows') }}
        run: cargo run --manifest-path test-override-with-dylib/Cargo.toml --features override

  lint:
    name: Rustfmt / Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --features config -- -D warnings
          cargo clippy --manifest-path libmimalloc-sys/Cargo.toml --features extended -- -D warnings

  # Detect cases where documentation links would be dead
  doc:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@nightly

      # Note: We need to use nightly rust, and `cargo rustdoc` (yes, not `cargo
      # doc`) to actually get it to respect -D warnings... Using nightly also
      # gets us the nicer syntax for linking to functions, and is in-line with
      # what docs.rs uses.

      - name: 'Check documentation links in `better_mimalloc_rs`'
        run: cargo rustdoc -- -D warnings

      - name: 'Check documentation links in `better_mimalloc_sys`'
        run: cargo rustdoc --manifest-path libmimalloc-sys/Cargo.toml -- -D warnings

      - name: Test nightly allocator API
        run: cargo test --features nightly_allocator_api
