[package]
name = "test-override-with-dylib"
version = "0.0.0"
license = "MIT OR Apache-2.0"
description = "A test helper for mimalloc"
edition = "2018"
publish = false

[dependencies]
libc = { version = "^0.2.8", default-features = false }
better_mimalloc_sys = { path = "../libmimalloc-sys", package = "better_mimalloc_sys" }

[build-dependencies]
cc = "^1.0.13"

[features]
override = ["better_mimalloc_sys/override"]
