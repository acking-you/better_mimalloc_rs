[package]
name = "better_mimalloc_sys"
version = "0.1.2"
authors = ["Octavian Oncescu <octavonce@gmail.com>"]
edition = "2018"
keywords = ["allocator", "encrypted-heap", "performance"]
categories = ["memory-management", "api-bindings"]
description = "Sys crate wrapping mimalloc v2 (fork for better_mimalloc_rs)"
license = "MIT"
links = "mimalloc"
repository = "https://github.com/acking-you/better_mimalloc_rs"
documentation = "https://docs.rs/better_mimalloc_sys"
exclude = [
    "/c_src/mimalloc/bin",
    "/c_src/mimalloc/cmake",
    "/c_src/mimalloc/contrib",
    "/c_src/mimalloc/doc",
    "/c_src/mimalloc/docs",
    "/c_src/mimalloc/ide",
    "/c_src/mimalloc/test",
    "/c_src/mimalloc/.git",
]

[dev-dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.10"

[features]
secure = []
debug = []
debug_in_debug = []
override = []
extended = []
arena = []
local_dynamic_tls = []
win_direct_tls = []
no_thp = []

# Show `extended` on docs.rs since it's the full API surface.
[package.metadata.docs.rs]
features = ["extended"]
